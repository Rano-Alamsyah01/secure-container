
name: Container Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: Build and Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build --pull --no-cache -t secure-flask:latest .

      # Pemeriksaan HIGH dan CRITICAL sebagai
      # penentu keberhasilan pipeline
      - name: Run Trivy Table Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-flask:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      # Membuat laporan SARIF untuk GitHub Security
      - name: Run Trivy SARIF Scan
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-flask:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: container-scanning
